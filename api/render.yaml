# Render blueprint. In the dashboard set Root Directory to "api".
services:
  - type: web
    name: sudhaar-ai-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set in the dashboard, not here. Pinning it to "true" in the blueprint
      # meant a blueprint sync could silently put the deployed API back on canned
      # agent output — the validator would stop calling the model and every
      # complaint would pass review regardless of what was in the photo.
      - key: MOCK_AGENTS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # set these in the Render dashboard, not here
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
